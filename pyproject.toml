[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic"
version = "0.1.0"
description = "Flask-based mock HTTP server with pluggable modules"
license = "MIT"
authors = [{ name = "hyphus" }]
urls = { Repository = "https://github.com/hyphus/mimic" }
requires-python = ">=3.12"
dependencies = [
    "Flask",
    "Werkzeug",
    "MarkupSafe",
    "gunicorn",
    "python-dotenv",
    "requests",
    "boto3",
    "botocore",
    "acme",
    "josepy",
    "cryptography",
    "dnspython",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

# requirements.txt is the pinned lockfile the Docker image installs; the list above
# is the declaration of what Mimic actually imports.

[tool.setuptools.packages.find]
include = ["mimic*"]

[tool.setuptools.package-data]
"mimic" = ["modules/*/module.json", "modules/*/**/*", "admin/templates/**/*.html", "admin/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
